name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Normal lifecycle install: the pinned moxml-ts git dependency builds in its prepare script.
      - run: npm ci
      - run: npm run check:artifacts
      - run: npm test
      - run: npm run check:package
  # A regeneration check (like mml-ts) needs the lutaml-ts generator revision recorded in
  # model/provenance.json to be public first; until then check:artifacts pins every generated file by sha256.
